*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Jost,system-ui,Arial,sans-serif}
input,select,button,textarea{font-family:Jost,system-ui,Arial,sans-serif}
body::after{content:"";position:fixed;right:-30px;bottom:-30px;width:150px;height:150px;background:var(--dots) center/contain no-repeat;opacity:.3;pointer-events:none;z-index:0}
header,main{position:relative;z-index:1}
main{max-width:780px;margin:0 auto;padding:0 16px 80px}
h1{font-weight:300;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--h1);margin:0 0 16px;padding:26px 0 14px;border-bottom:1px solid var(--text);position:relative;line-height:1.25}
h1::after{content:"";position:absolute;left:0;bottom:-4px;width:44px;height:7px;background:var(--green)}
@media(max-width:420px){h1{font-size:18px;letter-spacing:.1em}.lang button{font-size:14px;padding:3px 6px}}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 4px}
input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--fld);border-radius:var(--r);padding:11px;font-size:16px;min-height:44px}
#vPatrol.pv #bScan,#vPatrol.pv #bObsL,#vPatrol.pv #bGate,#vPatrol.pv #bVid,#vPatrol.pv #bTeamOpen,#vPatrol.pv #bPlanOpen,#vPatrol.pv #bTsOpen,#vPatrol.pv #lSecApp,#vPatrol.pv #bHold,#vPatrol.pv #bGps,#dTabs.pvh{display:none!important}#vPatrol.pv #bGps,#vPatrol.pv #bHk,#vPatrol.pv #bEq,#vPatrol.pv #bHkA,#vPatrol.pv #clockBox,#vPatrol.pv #bChange,#vPatrol.pv #pend{display:none!important}
#pvBar{border-color:var(--amber);background:var(--ban);position:sticky;top:48px;z-index:4}
textarea{min-height:90px;resize:vertical;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn{display:block;width:100%;background:var(--green);color:var(--text);border:1px solid var(--green);border-radius:var(--r);padding:12px 15px;min-height:44px;font-weight:600;font-size:16px;cursor:pointer;margin-top:12px;transition:background .15s}
.btn:hover{background:#3b9068}
#bScan{background:var(--amber);border-color:var(--amber)}#bScan:hover{background:#e6b400}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--fld);font-size:15px;padding:10px;font-weight:500}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:4px 6px 0 0}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.err{color:var(--bad);font-size:14px;margin:6px 0}
.banner{border-radius:var(--r);padding:10px 12px;margin:8px 0;font-size:15px;background:var(--ban);border:1px solid var(--amber);color:var(--text)}
.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card.empty::before{content:"";display:block;width:56px;height:56px;margin:4px auto 10px;background:var(--dots) center/contain no-repeat}
.card.empty p{text-transform:uppercase;letter-spacing:.08em;font-weight:300;color:var(--mute);font-size:15px}
.round{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.round b{font-size:16px;font-weight:600}.round span{color:var(--mute);font-size:14px}
#left{font-variant-numeric:tabular-nums;font-size:24px;font-weight:500}
#left.warn{color:var(--amber2)}#left.late{color:var(--bad)}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cnt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.cnt b{display:block;font-size:44px;font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums}
.cnt span{font-size:14px;color:var(--mute)}
.cnt.d b{color:var(--ok)}.cnt.r b{color:var(--text)}
.bar{height:8px;border-radius:4px;background:var(--bar);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .15s}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.kpi{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}.kpi b{display:block;font-size:26px;font-weight:600;line-height:1.1}.kpi span{display:block;font-size:13px;color:var(--mute)}.kpi.w{border-left-color:var(--amber)}.kpi.r{border-left-color:var(--bad)}.kpi.wide{grid-column:1/3}.dbar{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:6px}.dbar i{flex:1;background:var(--green);min-height:2px;border-radius:2px 2px 0 0}.dbar i.w{background:var(--amber)}.dbar i.r{background:var(--bad)}.dlab{display:flex;gap:4px;font-size:10px;color:var(--mute)}.dlab em{flex:1;text-align:center;font-style:normal}
html,body{overscroll-behavior-y:contain}
.tabs{display:flex;flex-wrap:wrap;gap:0 14px;margin:14px 0 8px;border-bottom:1px solid var(--line)}
.tabs button{flex:none;background:none;color:var(--mute);border:0;border-bottom:3px solid transparent;border-radius:0;padding:9px 2px;margin-bottom:-1px;font-size:15px;font-weight:400;cursor:pointer;min-height:44px}
.tabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--green)}
@media(max-width:420px){.tabs button{font-size:14px}}
.tsChip{background:var(--panel);color:var(--text);border:1px solid var(--fld);border-radius:999px;padding:6px 10px;font-size:13px}.tsChip.on{background:var(--green);border-color:var(--green)}.tsDn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:2px 6px}.cin{color:var(--mute)}.tst{width:100%;border-collapse:collapse;font-size:13px}.tst td,.tst th{padding:2px 3px;border-bottom:1px solid var(--line)}.tst input{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:3px}.tst tr.auto td{background:var(--auto)}
#tsPrint{display:none}
@media print{@page{size:A4;margin:0}html,body{background:#fff!important;margin:0!important;padding:0!important}body>*:not(#tsPrint){display:none!important}#tsPrint{display:block!important;color:#000;background:#fff}#tsPrint *{color:#000!important;background:#fff!important}}
#tsPrint .tsPg{box-sizing:border-box;width:210mm;height:296mm;padding:9mm 9mm 14mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}#tsPrint .tsPg:last-child{page-break-after:auto;break-after:auto}#tsPrint .tsFt{position:absolute;left:9mm;right:9mm;bottom:6mm;display:flex;justify-content:space-between;font-family:Arial,Helvetica,sans-serif;font-size:9px}
#tsPrint .tsf{font-family:Arial,Helvetica,sans-serif;font-size:11px}
#tsPrint .tsHd{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}#tsPrint .tsHd .lg{width:30%}#tsPrint .tsHd .lg img{height:13mm;display:block}
#tsPrint .tsft{flex:1;text-align:center;font-weight:bold;font-size:17px;white-space:nowrap}#tsPrint .tsR{width:30%;text-align:right;font-size:10px}#tsPrint .tsR img{height:10mm;display:block;margin:1px 0 0 auto}
#tsPrint .tsb{display:flex;border:1px solid #000;margin-bottom:5px}#tsPrint .tsb .c1{width:55%;border-right:1px solid #000;display:flex;flex-direction:column}#tsPrint .tsb .c2{flex:1;display:flex;flex-direction:column}
#tsPrint .tsb .rw{flex:1;display:flex;align-items:center;padding:2px 5px;font-size:12px;min-height:20px;border-bottom:1px solid #000;white-space:nowrap}#tsPrint .tsb .rw:last-child{border-bottom:0}#tsPrint .tsb .k{display:inline-block;width:112px;flex:none}#tsPrint .tsb .c1 .k{width:64px}
#tsPrint table{border-collapse:collapse;width:100%}#tsPrint .tsg th,#tsPrint .tsg td{border:1px solid #000;padding:1px 3px;text-align:center;height:18px}#tsPrint .tsg th{font-size:10px;white-space:nowrap;font-weight:bold}#tsPrint .tsg td.l{text-align:left}#tsPrint .tsg td.of{text-decoration:line-through}
#tsPrint .tsn{font-size:10px;margin:6px 0}#tsPrint .tss td{border:1px solid #000;vertical-align:top;padding:3px 5px;font-size:11px;height:19px}#tsPrint .tss td.sg{height:84px}#tsPrint .sgi{max-height:12mm;max-width:90%;margin-top:3px}
.bar{background:var(--line);height:8px;border-radius:4px;margin-top:3px}.bar i{display:block;height:8px;border-radius:4px;background:var(--text)}.zh{font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--mute);margin:14px 0 3px}
.pt{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:6px 0;font-size:16px}
.pt small{color:var(--mute);min-width:0;overflow-wrap:anywhere}.pt b{min-width:0;overflow-wrap:anywhere}
.pt.hi b::after{content:" \2605";color:var(--text)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}th{background:var(--panel2);font-weight:500}
.scroll{overflow-x:auto}
.fl{color:var(--text);font-weight:600;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(35,31,32,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.gzb{min-width:46px;min-height:46px;border-radius:999px;border:1px solid #fff8;background:#0008;color:#fff;font:600 22px Jost,Arial,sans-serif;cursor:pointer}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;width:100%;max-width:400px;max-height:92vh;overflow:auto}
#scanModal{padding:0;background:#000;flex-direction:column}
#cam{width:100%;max-height:75vh;object-fit:cover;background:#000}
.frame{position:absolute;left:50%;top:38%;width:62vmin;height:62vmin;max-width:300px;max-height:300px;transform:translate(-50%,-50%);border:3px solid var(--amber);border-radius:12px;pointer-events:none}
.big{font-size:56px;font-weight:300;text-align:center;line-height:1}
.okc{color:var(--ok)}.wrn{color:var(--text)}
.sp{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.links{margin-top:22px;text-align:center}
.links button{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;min-height:44px;text-decoration:underline;cursor:pointer}
.mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:6px 0}.mem.off{opacity:.55}.mem small{color:var(--mute)}.mem .acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}.mem .btn.sm{margin:0;padding:6px 10px;font-size:13px}.pinbig{font-size:44px;font-weight:500;letter-spacing:8px;text-align:center;color:var(--text);margin:8px 0;font-variant-numeric:tabular-nums}
.remember{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px}.remember input{width:20px;height:20px;margin:0}
.lmw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:12px;max-height:75vh;background:var(--panel)}.lmw svg{display:block;width:100%}.lmb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.lmb .btn.sm{margin:0}.lmk{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lmk i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}#lmInfo{min-height:24px;margin:8px 0 0;font-size:15px}

function pad(n){return (n<10?'0':'')+n;}
function fmtT(ms){return new Date(ms+7*3600000).toISOString().slice(11,16);}
function fmtLeft(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':':'')+pad(m)+':'+pad(s%60);}

try{S.pq=JSON.parse(ls('sp_pq')||'[]');}catch(e){S.pq=[];}
function savePQ(){ls('sp_pq',JSON.stringify(S.pq));}
function saveQ(){ls('sp_q',JSON.stringify(S.queue));}
function nowMs(){return Date.now()+S.off;}

/* ===== server ===== */
function api(body,ms){
  var ctl=window.AbortController?new AbortController():null,t=ctl?setTimeout(function(){ctl.abort();},ms||25000):null;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();}).then(function(j){if(t)clearTimeout(t);return j;},function(e){if(t)clearTimeout(t);throw e;});
}
function dropLogin(msg){S.pin='';S.guard='';S.state=null;ls('sp_gpin',null);ls('sp_gname',null);ls('sp_state',null);showSetup(msg||'');}
function loadState(quiet){
  if(PV.on)return pvLoad();
  if(!API_URL||!S.pin)return Promise.resolve(false);
  S.loading=true;
  return api({action:'state',gp:S.pin}).then(function(r){
    S.loading=false;
    if(!r||!r.ok){if(r&&r.err==='pin'){dropLogin(tr('badGuardPin'));}else if(r&&r.err==='locked'){S.online=false;render();}return false;}
    S.state=r;S.guard=r.me.name;ls('sp_gname',S.guard);S.off=r.now-Date.now();S.online=true;ls('sp_state',JSON.stringify(r));render();try{flushObs();}catch(e0){}return true;
  }).catch(function(){
    S.loading=false;S.online=false;
    if(!S.state){try{S.state=JSON.parse(ls('sp_state')||'null');}catch(e){}}
    render();return false;
  });
}
function flush(){
  if(PV.on)return Promise.resolve();
  if(!(S.queue.length||S.pq.length)||!API_URL||(S.flushing&&Date.now()-S.flushAt<90000))return Promise.resolve();
  S.flushing=true;S.flushAt=Date.now();
  var lim=Date.now()-36*3600000;S.queue=S.queue.filter(function(x){return x.ts>lim;});saveQ();S.pq=S.pq.filter(function(x){return x.ts>lim;});savePQ();
  var q=S.queue.slice(),p=Promise.resolve(),stop=false;
  q.forEach(function(it){p=p.then(function(){
    if(stop)return;
    /* two steps: the scan goes first WITHOUT the selfie; the server says whether a selfie was due; only then is the selfie sent */
    var b={action:'scan',gp:it.pin||S.pin,pid:it.pid,lat:it.lat,lng:it.lng,acc:it.acc,clientTs:it.ts,queued:true,vpn:it.vpn||''};
    return api(b).then(function(r){
      if(r&&(r.ok||r.err==='unknown_point')){
        S.queue=S.queue.filter(function(x){return x!==it&&x.ts!==it.ts;});saveQ();
        if(r.ok&&r.needPhoto&&r.scanId&&it.photo){S.pq.push({scanId:r.scanId,photo:it.photo,pin:it.pin||S.pin,ts:it.ts});savePQ();}
      }
      else if(r&&r.err==='pin'){if(S.pin&&it.guard===S.guard&&it.pin!==S.pin){it.pin=S.pin;saveQ();}stop=true;}
      else if(r&&r.err==='locked'){stop=true;}
    },function(){stop=true;});
  });});
  p=p.then(function(){return stop?null:flushPhotos();});
  return p.then(function(){S.flushing=false;render();return loadState(true);},function(){S.flushing=false;});
}
function flushPhotos(){
  var p=Promise.resolve();
  S.pq.slice().forEach(function(x){p=p.then(function(){
    return api({action:'photo',gp:x.pin||S.pin,scanId:x.scanId,photo:x.photo},60000).then(function(r){
      if(r&&(r.ok||r.err==='has_photo'||r.err==='too_late'||r.err==='no_scan'||r.err==='bad_photo'||r.err==='not_needed')){S.pq=S.pq.filter(function(y){return y!==x;});savePQ();}

function lmHas(p){return p.x!=null||(p.lat!=null&&p.lng!=null&&p.lat!==''&&p.lng!=='');}
var LM={lat1:3.13145,lat0:3.12965,lng0:99.34720,lng1:99.35070,W:1000,H:511,zoom:1,C:{NW:[3.131341,99.347342],NE:[3.131336,99.350326],SE:[3.129740,99.350593],SW:[3.129797,99.347316]},MID:99.348803};
function lmXY(lat,lng){return [(lng-LM.lng0)/(LM.lng1-LM.lng0)*LM.W,(LM.lat1-lat)/(LM.lat1-LM.lat0)*LM.H];}
function lmOutline(){
  var c=LM.C,P=[c.NW,c.NE,c.SE,c.SW].map(function(q){return lmXY(q[0],q[1]);}),pts=P.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
  function yAt(a,b,lng){var t=(lng-a[1])/(b[1]-a[1]);return lmXY(a[0]+t*(b[0]-a[0]),lng);}
  var n=yAt(c.NW,c.NE,LM.MID),so=yAt(c.SW,c.SE,LM.MID),F='font-family="Jost,system-ui,Arial,sans-serif"';
  return '<polygon points="'+pts+'" style="fill:var(--panel2);stroke:var(--text)" stroke-width="2"/><line x1="'+n[0].toFixed(1)+'" y1="'+n[1].toFixed(1)+'" x2="'+so[0].toFixed(1)+'" y2="'+so[1].toFixed(1)+'" style="stroke:var(--text)" stroke-width="2" stroke-dasharray="10 6"/>'
   +'<text x="'+((P[0][0]+n[0])/2).toFixed(0)+'" y="'+(P[3][1]-14).toFixed(0)+'" font-size="26" font-weight="300" letter-spacing="4" style="fill:var(--mute)" text-anchor="middle" '+F+'>PLOT 6A</text><text x="'+((n[0]+P[1][0])/2).toFixed(0)+'" y="'+(P[3][1]-14).toFixed(0)+'" font-size="26" font-weight="300" letter-spacing="4" style="fill:var(--mute)" text-anchor="middle" '+F+'>PLOT 6B</text>'
   +'<text x="'+(LM.W-30)+'" y="36" font-size="26" font-weight="500" style="fill:var(--mute)" text-anchor="middle" '+F+'>N &#8593;</text>';
}
function lmHtml(r,guard){
  var pts=[],no=[];
  r.done.forEach(function(p){p.st='d';(lmHas(p)?pts:no).push(p);});
  r.missed.forEach(function(p){p.st='m';(lmHas(p)?pts:no).push(p);});
  var z=LM.zoom,h='<div class="lmb"><button class="btn ghost sm" id="lmZ" type="button">'+esc(z>1?tr('mapFit'):tr('mapZoom'))+'</button><span class="lmk"><span><i style="background:#44a276"></i>'+esc(tr('mapDone'))+'</span><span><i style="background:#ffc600"></i>'+esc(tr('mapNot'))+'</span><span><i style="border:2px solid #231f20;background:#fff"></i>'+esc(tr('mapHi'))+'</span></span></div>';
  h+='<div class="lmw"><svg id="lmSvg" viewBox="0 0 '+LM.W+' '+LM.H+'" style="width:'+(z*100)+'%" role="img" aria-label="Site map">'+lmOutline();

  });

$('hkBody').addEventListener('input',function(e){var t=e.target,n=t.getAttribute&&t.getAttribute('data-hkn');if(n!==null&&n!==undefined&&n!=='')HK.res[Number(n)].note=t.value;if(t.id==='hkNote')HK.note=t.value;});
$('hkBody').addEventListener('click',function(e){
  var t=e.target;if(!t)return;
  var k=t.getAttribute&&t.getAttribute('data-hk');
  if(k){HK.res[Number(t.getAttribute('data-i'))].ok=k==='ok';HK.err='';hkDraw();return;}
  if(t.id==='hkBack'){showHome();return;}
  if(t.id==='hkTN'){HK.tab='new';hkDraw();return;}
  if(t.id==='hkTA'){HK.tab='acts';HK.list=null;hkDraw();return;}
  var vf=t.getAttribute&&t.getAttribute('data-vf'),vr=t.getAttribute&&t.getAttribute('data-vr');
  if(vf||vr){var id=vf||vr,inp=$('hkBody').querySelector('input[data-vn="'+id+'"]'),note=inp?inp.value:'';
    if(vr&&note.replace(/\s+/g,' ').trim().length<3){alert(tr('hkReason'));if(inp)inp.focus();return;}
    t.disabled=true;api({action:'d_hk_verify',gp:S.pin,id:id,ok:!!vf,note:note}).then(function(r){if(r&&r.ok){HK.list=null;hkDraw();}else{t.disabled=false;alert(errText(r&&r.err||'server'));}}).catch(function(){t.disabled=false;});return;}
  if(t.id==='hkSave'&&!HK.busy){
    if(HK.res.some(function(r){return r.ok===null;})){HK.err=tr('hkAllNeed');hkDraw();return;}
    if(HK.res.some(function(r){return r.ok===false&&r.note.replace(/\s+/g,' ').trim().length<3;})){HK.err=tr('hkNoteNeed');hkDraw();return;}
    HK.busy=true;HK.err='';hkDraw();
    api({action:'d_hk_save',gp:S.pin,rows:HK.res.map(function(r,i){return {i:i,ok:r.ok,note:r.note};}),note:HK.note}).then(function(r){
      HK.busy=false;
      if(r&&r.ok){var n=r.notOk;hkLoad();HK.msg=tr('hkSaved')+' '+n;setTimeout(function(){HK.msg=tr('hkSaved')+' '+n;hkDraw();},400);loadState(true);}
      else{HK.err=errText(r&&r.err||'server');hkDraw();}
    }).catch(function(){HK.busy=false;HK.err=errText('server');hkDraw();});
  }
});

  $('aBody').innerHTML='<h1>'+esc(tr('hkTitle'))+'</h1><p><span class="sp"></span></p>';

    if(!r.open.length)h+='<p class="note">None.</p>';
    h+='<div class="zh">Done by the guards, not yet verified</div>';

    h+='<div class="zh">Recent building checks</div>';
    r.checks.forEach(function(c){h+='<div class="pt'+(c.notOk?' hi':'')+'"><b>'+esc(c.date)+' '+esc(shL(c.shift))+' &middot; '+esc(c.by)+' &middot; '+c.notOk+' not OK of '+c.items+'</b>'+(c.note?'<small>'+esc(c.note)+'</small>':'')+'</div>';});
    if(!r.checks.length)h+='<p class="note">No building check yet.</p>';

/* ===== Clock in (shift start). Button only inside the circle around the guard house; the server checks again. ===== */
var CK={wid:null,pos:null,html:'',busy:false,msg:'',paused:false};
function ckDist(a,b,c,d){var R=6371000,t=Math.PI/180,dl=(c-a)*t,dn=(d-b)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}
function ckStop(){if(CK.wid!==null){try{navigator.geolocation.clearWatch(CK.wid);}catch(e){}CK.wid=null;}}
function ckStart(){
  if(CK.paused||CK.wid!==null||!navigator.geolocation)return;
  try{CK.wid=navigator.geolocation.watchPosition(function(p){CK.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};clockRender();},function(){},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});}catch(e){CK.wid=null;}
}
function clockInside(c){
  var p=CK.pos;if(!p||Date.now()-p.t>90000)return false;
  return ckDist(p.lat,p.lng,c.gate.lat,c.gate.lng)<=c.gate.r+Math.min(p.acc||0,30);
}
function clockRender(){
  if(PV.on){ckStop();var pb=$('clockBox');if(pb)pb.innerHTML='';return;}
  var box=$('clockBox'),st=S.state;if(!box||!st||$('vPatrol').classList.contains('hidden')){ckStop();return;}
  var c=st.clock,h='',now=nowMs();
  if(!c){box.innerHTML='';return;}
  if(c.mine){
    ckStop();
    h='<div class="card"><b>&#10003; '+esc(tr('clkDone'))+' '+esc(c.mine.at)+'</b> <span class="note">'+(c.mine.status==='LATE'?esc(tr('clkLate'))+' '+c.mine.late+' '+esc(tr('clkMin')):(c.mine.status==='MANUAL'?esc(tr('clkManual')):esc(tr('clkOn'))))+'</span><br><small class="note">'+esc(tr('sh'+c.shift))+'</small></div>';
  }else if(c.win&&now>=c.win.opens&&now<=c.win.closes){
    ckStart();
    if(CK.busy)h='<div class="card"><span class="sp"></span>'+esc(tr('clkBusy'))+'</div>';
    else if(clockInside(c))h='<button class="btn" id="bClock" type="button">'+esc(tr('clkIn'))+' &middot; '+esc(tr('sh'+c.win.shift))+'</button>'+(CK.msg?'<div class="note">'+esc(CK.msg)+'</div>':'');
    else h='<div class="note">'+esc(tr(CK.pos?'clkGate':'clkWait'))+'</div>';
  }else{ckStop();}
  if(h!==CK.html){CK.html=h;box.innerHTML=h;var b=$('bClock');if(b)b.addEventListener('click',clockTap);}
}
function clockTap(){
  var c=S.state&&S.state.clock;if(!c||CK.busy)return;
  CK.busy=true;CK.msg='';clockRender();
  (CK.pos&&Date.now()-CK.pos.t<30000?Promise.resolve(CK.pos):getFix()).then(function(f){
    return api({action:'clockin',gp:S.pin,lat:f?f.lat:null,lng:f?f.lng:null,acc:f?f.acc:null});
  }).then(function(r){
    CK.busy=false;
    if(r&&r.ok){CK.msg='';return loadState(true);}
    if(r&&r.err==='no_window'){return loadState(true);}
    CK.msg=tr('clkRetry');CK.html='';clockRender();
  }).catch(function(){CK.busy=false;CK.msg=tr('clkNet');CK.html='';clockRender();});
}

/* ===== Short low-resolution video, stored in Google Drive ===== */
var VD={stream:null,rec:null,chunks:[],blob:null,mime:'',t0:0,timer:null,sec:0};
var VMAX=30;
function vStop(){if(VD.timer){clearInterval(VD.timer);VD.timer=null;}try{if(VD.rec&&VD.rec.state!=='inactive')VD.rec.stop();}catch(e){}}
function vClose(){vStop();if(VD.stream){VD.stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});VD.stream=null;}var v=$('vPrev');v.srcObject=null;v.removeAttribute('src');}
function vReset(){VD.chunks=[];VD.blob=null;VD.sec=0;$('vTime').textContent='';$('vMsg').textContent='';$('vRec').classList.remove('hidden');$('vRec').textContent=tr('vidRec');$('vSend').classList.add('hidden');$('vRetake').classList.add('hidden');}
function vOpen(){
  show('vVid');vReset();
  var md=navigator.mediaDevices;
  if(!md||!md.getUserMedia||!window.MediaRecorder){$('vMsg').textContent=tr('vidNoCam');$('vRec').classList.add('hidden');return;}
  var c={video:{facingMode:{ideal:'environment'},width:{ideal:480},height:{ideal:270},frameRate:{ideal:15,max:20}},audio:true};
  md.getUserMedia(c).catch(function(){return md.getUserMedia({video:c.video,audio:false});}).then(function(st){
    VD.stream=st;var v=$('vPrev');v.srcObject=st;v.muted=true;try{v.play();}catch(e){}
  }).catch(function(){$('vMsg').textContent=tr('vidNoCam');$('vRec').classList.add('hidden');});
}
function vPickMime(){var L=['video/webm;codecs=vp8,opus','video/webm','video/mp4'];for(var i=0;i<L.length;i++){try{if(MediaRecorder.isTypeSupported(L[i]))return L[i];}catch(e){}}return '';}
$('vRec').addEventListener('click',function(){
  if(VD.rec&&VD.rec.state==='recording'){vStop();return;}
  if(!VD.stream)return;
  VD.chunks=[];VD.mime=vPickMime();
  try{VD.rec=new MediaRecorder(VD.stream,VD.mime?{mimeType:VD.mime,videoBitsPerSecond:250000,audioBitsPerSecond:32000}:{videoBitsPerSecond:250000});}catch(e){$('vMsg').textContent=tr('vidNoCam');return;}
  VD.rec.ondataavailable=function(e){if(e.data&&e.data.size)VD.chunks.push(e.data);};
  VD.rec.onstop=function(){
    if(VD.timer){clearInterval(VD.timer);VD.timer=null;}
    VD.blob=new Blob(VD.chunks,{type:(VD.rec&&VD.rec.mimeType)||VD.mime||'video/webm'});VD.sec=Math.max(1,Math.round((Date.now()-VD.t0)/1000));
    var v=$('vPrev');v.srcObject=null;v.src=URL.createObjectURL(VD.blob);v.muted=false;v.controls=true;
    $('vRec').classList.add('hidden');$('vSend').classList.remove('hidden');$('vRetake').classList.remove('hidden');$('vTime').textContent=VD.sec+' s';
  };
  VD.t0=Date.now();VD.rec.start(1000);$('vRec').textContent=tr('vidStop');
  VD.timer=setInterval(function(){var el=Math.round((Date.now()-VD.t0)/1000);$('vTime').textContent=el+' / '+VMAX+' s';if(el>=VMAX)vStop();},250);
});
$('vRetake').addEventListener('click',function(){var v=$('vPrev');v.controls=false;v.removeAttribute('src');v.srcObject=VD.stream;v.muted=true;try{v.play();}catch(e){}vReset();});
$('vSend').addEventListener('click',function(){
  if(!VD.blob)return;
  $('vMsg').textContent=tr('vidSending');$('vSend').disabled=true;
  var fr=new FileReader(),blob=VD.blob,sec=VD.sec;
  fr.onerror=function(){$('vSend').disabled=false;$('vMsg').textContent=tr('vidFail');};
  fr.onload=function(){
    var it={id:newCid(),b64:String(fr.result).split(',')[1]||'',mime:blob.type,sec:sec,note:(S.state&&S.state.hold&&S.state.hold.on)?'Weather hold':'Conditions',pin:S.pin,ts:Date.now()};
    var done=function(msg){$('vSend').disabled=false;$('vMsg').textContent=msg;vClose();setTimeout(function(){showPatrol();},1800);};
    var queue=function(why){vqPut(it).then(function(){vqCount();done(tr('vidQueued'));},function(){$('vSend').disabled=false;$('vMsg').textContent=tr('vidFail')+(why?' ('+why+')':'');});};
    if(S.online===false||navigator.onLine===false){queue('');return;}
    api({action:'video',gp:it.pin,cid:it.id,video:it.b64,mime:it.mime,sec:it.sec,note:it.note},90000).then(function(r){
      if(r&&r.ok){done(tr('vidSent'));}
      else if(r&&r.err==='bad_video'){$('vSend').disabled=false;$('vMsg').textContent=tr('vidFail')+' (bad_video)';}
      else queue(r&&r.err||'');
    }).catch(function(){queue('');});
  };
  fr.readAsDataURL(blob);
});
/* videos that could not be sent wait on the phone (IndexedDB) and go out when there is signal */
var VQ={n:0,busy:false};
function vqDb(){return new Promise(function(res,rej){try{var r=indexedDB.open('sp_vq',1);r.onupgradeneeded=function(){r.result.createObjectStore('v',{keyPath:'id'});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function vqAll(){return vqDb().then(function(db){return new Promise(function(res){var q=db.transaction('v','readonly').objectStore('v').getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){res([]);};});}).catch(function(){return [];});}
function vqPut(it){return vqDb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('v','readwrite');tx.objectStore('v').put(it);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function vqDel(id){return vqDb().then(function(db){return new Promise(function(res){var tx=db.transaction('v','readwrite');tx.objectStore('v').delete(id);tx.oncomplete=function(){res();};tx.onerror=function(){res();};});}).catch(function(){});}
function vqCount(){return vqAll().then(function(a){VQ.n=a.length;try{render();}catch(e){}return a;});}
function vqFlush(){
  if(VQ.busy||PV.on||!API_URL||!S.pin)return Promise.resolve();
  VQ.busy=true;
  return vqAll().then(function(a){
    var p=Promise.resolve(),stop=false,lim=Date.now()-48*3600000;
    a.forEach(function(it){p=p.then(function(){
      if(stop)return;
      if(it.ts<lim)return vqDel(it.id);
      return api({action:'video',gp:it.pin||S.pin,cid:it.id,video:it.b64,mime:it.mime,sec:it.sec,note:it.note},90000).then(function(r){
        if(r&&(r.ok||r.err==='bad_video'))return vqDel(it.id);
        if(r&&r.err==='pin'&&S.pin&&it.pin!==S.pin){it.pin=S.pin;return vqPut(it);}
        stop=true;
      },function(){stop=true;});
    });});
    return p;
  }).then(function(){VQ.busy=false;return vqCount();},function(){VQ.busy=false;});
}
window.addEventListener('online',function(){vqFlush();});
setTimeout(function(){vqCount().then(function(a){if(a.length)vqFlush();});},1500);
setInterval(function(){if(VQ.n&&navigator.onLine!==false)vqFlush();},30000);

  GT.ref=ref;GT.chk={};GT.rej=false;GT.err='';GT.view='load';gateDraw();
  api({action:'gate_get',gp:S.pin,ref:ref},45000).then(function(r){return r;},function(){return null;}).then(function(r){
    if(r&&r.err==='pin'){dropLogin(tr('badGuardPin'));return;}
    if(!r||!r.ok){GT.view='list';GT.err=gErr(r?r.err:'gate_down');gateDraw();return;}
    GT.data=r;GT.view='detail';gateDraw();window.scrollTo(0,0);
  });
}
function gateParse(raw){var m=/MGP-(?:[A-Z0-9]{2,8}-)?\d{4}-\d{3,}/i.exec(String(raw||''));return m?m[0].toUpperCase():'';}
function gateScan(){
  openScan(function(raw){var ref=gateParse(raw);if(!ref){GT.view='list';GT.err=tr('gateBadRef');show('vGate');gateDraw();return;}show('vGate');gateLoadRef(ref);});
}
function gateDecide(dec){
  if(GT.busy)return;var why=dec==='reject'?(($('gWhy')&&$('gWhy').value)||'').replace(/\s+/g,' ').trim():'';
  if(dec==='reject'&&why.length<3){GT.err=gErr('need_reason');gateDraw();return;}
  GT.busy=true;GT.err='';gateDraw();var eb=$('gErr');if(eb)eb.innerHTML='<span class="sp"></span>'+esc(tr('sending'));
  getFix().then(function(fix){
    return api({action:'gate_release',gp:S.pin,ref:GT.ref,decision:dec,reason:why,checks:GT.chk,lat:fix?fix.lat:null,lng:fix?fix.lng:null,acc:fix?fix.acc:null},60000).then(function(r){return r;},function(){return null;});
  }).then(function(r){
    GT.busy=false;
    if(r&&r.err==='pin'){dropLogin(tr('badGuardPin'));return;}
    if(!r){GT.err=tr('gateNoNet');gateDraw();return;}
    if(!r.ok){GT.err=gErr(r.err)+(r.err==='already_released'&&r.by?' '+r.by+' · '+r.at:'');gateDraw();return;}
    GT.done={ref:GT.ref,msg:dec==='release'?tr('gateReleased'):tr('gateRejectedOk')};GT.view='done';GT.at=0;gateBadge();gateDraw();window.scrollTo(0,0);
  });
}
$('gateBody').addEventListener('click',function(e){
  var t=e.target;if(!t)return;
  var z=t.getAttribute&&t.getAttribute('data-gz');
  if(z){GZ.s=1;GZ.x=0;GZ.y=0;gzApply();$('gzImg').src=t.src;$('gzModal').classList.remove('hidden');return;}
  var o=t.closest&&t.closest('[data-gopen]');if(o){gateLoadRef(o.getAttribute('data-gopen'));return;}
  var id=t.id;
  if(id==='gHome'){showPatrol();}
  else if(id==='gScan'){gateScan();}
  else if(id==='gRefresh'){GT.err='';gateBadge();}
  else if(id==='gRefGo'){var ref=gateParse($('gRef').value);if(!ref){GT.err=tr('gateBadRef');gateDraw();return;}gateLoadRef(ref);}
  else if(id==='gBackList'){GT.view='list';GT.err='';gateDraw();gateBadge();}
  else if(id==='gRelease'){gateDecide('release');}
  else if(id==='gReject'){GT.rej=true;gateDraw();}
  else if(id==='gRejGo'){gateDecide('reject');}
});

var GZ={s:1,x:0,y:0,pt:{},d0:0,s0:1};
function gzApply(){if(GZ.s<=1){GZ.s=1;GZ.x=0;GZ.y=0;}$('gzImg').style.transform='translate('+GZ.x+'px,'+GZ.y+'px) scale('+GZ.s+')';}
function gzSet(s){GZ.s=Math.max(1,Math.min(6,s));gzApply();}
function gzClose(){$('gzModal').classList.add('hidden');$('gzImg').src='';GZ.pt={};GZ.s=1;gzApply();}
$('gzIn').addEventListener('click',function(){gzSet(GZ.s*1.5);});$('gzOut').addEventListener('click',function(){gzSet(GZ.s/1.5);});$('gzRs').addEventListener('click',function(){gzSet(1);});$('gzX').addEventListener('click',gzClose);
$('gzSt').addEventListener('wheel',function(e){e.preventDefault();gzSet(GZ.s*(e.deltaY<0?1.2:1/1.2));},{passive:false});
$('gzSt').addEventListener('dblclick',function(){gzSet(GZ.s>1?1:2.5);});
$('gzSt').addEventListener('pointerdown',function(e){try{$('gzSt').setPointerCapture(e.pointerId);}catch(x){}GZ.pt[e.pointerId]={x:e.clientX,y:e.clientY};var k=Object.keys(GZ.pt);if(k.length===2){var a=GZ.pt[k[0]],b=GZ.pt[k[1]];GZ.d0=Math.hypot(a.x-b.x,a.y-b.y);GZ.s0=GZ.s;}});
$('gzSt').addEventListener('pointermove',function(e){var p=GZ.pt[e.pointerId];if(!p)return;var k=Object.keys(GZ.pt);if(k.length===2){GZ.pt[e.pointerId]={x:e.clientX,y:e.clientY};var a=GZ.pt[k[0]],b=GZ.pt[k[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);if(GZ.d0>0)gzSet(GZ.s0*dd/GZ.d0);}else if(GZ.s>1){GZ.x+=e.clientX-p.x;GZ.y+=e.clientY-p.y;GZ.pt[e.pointerId]={x:e.clientX,y:e.clientY};gzApply();}});
['pointerup','pointercancel'].forEach(function(n){$('gzSt').addEventListener(n,function(e){delete GZ.pt[e.pointerId];});});

function pvApply(r){

function pvLoad(){
  if(!PV.on)return Promise.resolve(false);

  }).catch(function(){return false;});
}
function pvOpen(name){
  if(PV.on)return;

var MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function monthLabel(m){var p=String(m||'').split('-'),i=Number(p[1])-1;return ((lang==='id'?MONTHS_ID:MONTHS_EN)[i]||p[1])+' '+p[0];}
function awardCard(){
  var box=$('awardCard');if(!box)return;var a=S.state&&S.state.award;

  setHtml(box,'<div class="card" style="text-align:center"><div class="note">&#127942; '+esc(tr('awardT'))+' &middot; '+esc(monthLabel(a.month))+'</div><b style="font-size:20px">'+esc(a.winner)+'</b></div>');
}
var AW={month:''};
function aAward(){
  if(!AW.month)AW.month=today().slice(0,7);
  $('aBody').innerHTML='<p><span class="sp"></span></p>';
  aApi({action:'a_award_get',month:AW.month}).then(function(r){

    h+='<p class="note">Random draw among guards who meet the criteria below. Danru and Shift Supervisors are not in the draw. Repeat scans do not count.</p>';
    h+='<label for="awS">Minimum scans in the month</label><input type="number" id="awS" min="0" inputmode="numeric" value="'+c.minScans+'">';
    h+='<label for="awD">Minimum days with a scan</label><input type="number" id="awD" min="0" inputmode="numeric" value="'+c.minDays+'">';
    h+='<label for="awI">Maximum problem scans (blank = no limit)</label><input type="number" id="awI" min="0" inputmode="numeric" value="'+(c.maxIssues==null?'':c.maxIssues)+'">';
    h+='<p class="note"><b>Observation criteria</b> (this month, guards only; 0 = no minimum)</p>';
    h+='<label for="awO">Minimum observations</label><input type="number" id="awO" min="0" inputmode="numeric" value="'+c.minObs+'">';
    h+='<label for="awP">Minimum positive observations</label><input type="number" id="awP" min="0" inputmode="numeric" value="'+c.minPos+'">';
    h+='<label for="awX">Minimum issues identified</label><input type="number" id="awX" min="0" inputmode="numeric" value="'+c.minIss+'">';
    h+='<label for="awH">Minimum observations with a photo</label><input type="number" id="awH" min="0" inputmode="numeric" value="'+c.minOPhotos+'">';
    h+='<label for="awC">Minimum issues closed on the spot</label><input type="number" id="awC" min="0" inputmode="numeric" value="'+c.minSpot+'">';
    h+='<p class="note">Problem scans = scans with one of these flags: '+esc(c.issueFlags.join(', '))+'. Change the list in the Config sheet (AWARD_ISSUE_FLAGS). No GPS is not counted against a guard.</p>';
    h+='<button class="btn sm" id="awSave" type="button">Save criteria</button><div id="awMsg" class="note"></div></div>';
    var nq=r.rows.filter(function(x){return x.q;}).length;
    h+='<div class="card"><b>'+nq+' of '+r.rows.length+' guards qualify</b>';
    r.rows.forEach(function(x){h+='<div class="pt"><b>'+(x.q?'&#9989; ':'&#10060; ')+esc(x.guard)+'</b><small>'+x.scans+' scans, '+x.days+' days, '+x.issues+' problem, '+x.photos+' photos<br>Observations: '+x.obs+' (positive '+x.pos+' : issues '+x.iss+'), '+x.ophotos+' with photo, '+x.spot+' closed on the spot</small></div>';});

      var dr=r.history.filter(function(x){return x.status==='Draft';}),last=dr[dr.length-1];

/* ===== Shift plan (Danru, Shift Supervisor, admin) ===== */
var PL={mode:'danru',box:null,on:false,date:'',shift:'',rows:[],day:{P:[],S:[],M:[]},guards:[],duties:[],msg:'',ok:true,busy:false,loaded:false};
function jktToday(){return new Date(nowMs()+7*3600000).toISOString().slice(0,10);}
function addDays(d,n){return new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);}
function shiftNow(){var h=new Date(nowMs()+7*3600000).getUTCHours();return h>=7&&h<15?'P':(h>=15&&h<23?'S':'M');}
function dayHtml(day,date,me){
  var st=S.state&&S.state.plan,cur=st?st.date+st.shift:'',h='';
  ['P','S','M'].forEach(function(c){
    var rows=(day&&day[c])||[],isNow=cur&&cur===date+c;
    h+='<div style="margin-top:10px"><b>'+esc(tr('sh'+c))+'</b>'+(isNow?' <span class="okc">&#9679; '+esc(tr('nowTag'))+'</span>':'')+'</div>';
    if(!rows.length)h+='<div class="note">'+esc(tr('noneYet'))+'</div>';
    rows.forEach(function(r){
      var mine=me&&(r.guard.toLowerCase()===me||(r.buddy&&r.buddy.toLowerCase()===me));
      h+='<div style="margin-top:4px'+(mine?';font-weight:700':'')+'">'+esc(r.duty)+': '+esc(r.guard)+(r.buddy?' + '+esc(r.buddy):'')+(mine?' &#9733; '+esc(tr('planYou')):'')+'</div>';
    });
  });
  return h;
}
function planCard(){
  var st=S.state,box=$('planCard');if(!box)return;
  var p=st&&st.plan,any=false;
  if(p&&p.day)['P','S','M'].forEach(function(c){if((p.day[c]||[]).length)any=true;});
  if(!any){setHtml(box,'');return;}
  setHtml(box,'<div class="card"><b>'+esc(tr('planYour'))+' &middot; '+esc(p.date)+'</b>'+dayHtml(p.day,p.date,(S.guard||'').toLowerCase())+'</div>');
}
function pApi(b){if(PL.mode==='admin')b.pin=A.pin;else b.gp=S.pin;return api(b);}
function planOpen(mode){
  PL.mode=mode||'danru';PL.box=PL.mode==='admin'?$('aBody'):$('planBody');PL.on=true;$('planBody').innerHTML='';if(PL.mode!=='admin')$('aBody').innerHTML='';
  PL.date=jktToday();PL.shift=shiftNow();PL.msg='';PL.ok=true;PL.loaded=false;
  if(PL.mode!=='admin')show('vPlan');
  planLoad();
}
function planLoad(){
  PL.box.innerHTML='<p><span class="sp"></span> '+esc(tr('planLoad'))+'</p>';
  pApi({action:'d_plan_get',date:PL.date,shift:PL.shift}).then(function(r){
    if(!r.ok){if(r.err==='auth'||r.err==='pin'){if(PL.mode==='admin')aErr({err:'pin'});else dropLogin(tr('badGuardPin'));return;}PL.box.innerHTML='<p class="err">'+esc(errText(r.err))+'</p>';return;}
    PL.guards=r.guards;PL.duties=r.duties;PL.day=r.day||{P:[],S:[],M:[]};
    PL.rows=r.rows.map(function(x){return {duty:x.duty,guard:x.guard,buddy:x.buddy};});
    if(!PL.rows.length)PL.rows=r.duties.map(function(d){return {duty:d,guard:'',buddy:''};});
    PL.loaded=true;planDraw();
  }).catch(function(){PL.box.innerHTML='<p class="err">No connection.</p>';});
}
function planDraw(){
  if(!PL.loaded||!PL.box){return;}
  var used={};PL.rows.forEach(function(r){if(r.guard)used[r.guard]=1;if(r.buddy)used[r.buddy]=1;});
  function opts(sel,blank){
    var o='<option value="">'+esc(blank)+'</option>';
    PL.guards.forEach(function(g){var dis=used[g]&&g!==sel;o+='<option value="'+esc(g)+'"'+(g===sel?' selected':'')+(dis?' disabled':'')+'>'+esc(g)+'</option>';});
    return o;
  }
  var min=addDays(jktToday(),-1),max=addDays(jktToday(),14);
  var h='<div class="card"><b>'+esc(tr('plan'))+'</b><label class="note" for="plDate" style="display:block;margin-top:8px">'+esc(tr('planDate'))+'</label><input type="date" id="plDate" value="'+esc(PL.date)+'" min="'+min+'" max="'+max+'"><div class="tabs" style="margin-top:10px">';
  ['P','S','M'].forEach(function(c){h+='<button type="button" data-a="sh" data-v="'+c+'" class="'+(PL.shift===c?'on':'')+'">'+esc(tr('sh'+c))+'</button>';});
  h+='</div><p class="note">'+esc(tr('planNote'))+'</p></div>';
  h+='<div class="card"><b>'+esc(tr('dayAll'))+' &middot; '+esc(PL.date)+'</b>'+dayHtml(PL.day,PL.date,'')+'</div>';
  PL.rows.forEach(function(r,i){
    var need=PL.shift==='M'&&r.guard&&!r.buddy;
    h+='<div class="card"><label class="note">'+esc(tr('planDuty'))+'</label><select data-i="'+i+'" data-f="duty">';
    PL.duties.forEach(function(d){h+='<option value="'+esc(d)+'"'+(d===r.duty?' selected':'')+'>'+esc(d)+'</option>';});
    h+='</select><label class="note" style="margin-top:8px;display:block">'+esc(tr('planGuard'))+'</label><select data-i="'+i+'" data-f="guard">'+opts(r.guard,tr('chooseGuard'))+'</select>'
      +'<label class="note" style="margin-top:8px;display:block">'+esc(tr('planBuddy'))+'</label><select data-i="'+i+'" data-f="buddy">'+opts(r.buddy,tr('noBuddy'))+'</select>'
      +(need?'<div class="wrn" style="margin-top:6px">'+esc(tr('buddyNight'))+'</div>':'')
      +'<button class="btn sm ghost" type="button" data-a="del" data-v="'+i+'">'+esc(tr('delRow'))+' &times;</button></div>';
  });
  h+='<button class="btn ghost" type="button" data-a="add">+ '+esc(tr('addDuty'))+'</button><button class="btn" type="button" data-a="save"'+(PL.busy?' disabled':'')+'>'+esc(tr('planSave'))+'</button>';
  h+='<div class="'+(PL.ok?'okc':'err')+'" id="plMsg" style="margin-top:8px">'+esc(PL.msg)+'</div>';
  PL.box.innerHTML=h;
}
function planChange(e){
  if(!PL.on||PL.box!==e.currentTarget)return;
  var t=e.target,i=t.getAttribute&&t.getAttribute('data-i'),f=t.getAttribute&&t.getAttribute('data-f');
  if(t.id==='plDate'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){PL.date=t.value;PL.msg='';planLoad();}return;}
  if(i==null||!f)return;PL.rows[+i][f]=t.value;PL.msg='';planDraw();
}
function planClick(e){
  if(!PL.on||PL.box!==e.currentTarget)return;
  var a=e.target&&e.target.getAttribute&&e.target.getAttribute('data-a'),v=e.target&&e.target.getAttribute&&e.target.getAttribute('data-v');
  if(!a)return;
  if(a==='sh'){PL.shift=v;PL.msg='';planLoad();}
  if(a==='del'){PL.rows.splice(+v,1);planDraw();}
  if(a==='add'){PL.rows.push({duty:PL.duties[PL.duties.length-1]||'',guard:'',buddy:''});planDraw();}
  if(a==='save'){
    PL.busy=true;PL.msg='';planDraw();
    pApi({action:'d_plan_set',date:PL.date,shift:PL.shift,rows:PL.rows}).then(function(r){
      PL.busy=false;
      if(!r.ok){PL.ok=false;PL.msg=errText(r.err);planDraw();return;}
      PL.day[PL.shift]=PL.rows.filter(function(x){return x.guard;}).map(function(x){return {duty:x.duty,guard:x.guard,buddy:x.buddy};});
      PL.ok=true;PL.msg=r.warn&&r.warn.length?tr('buddyWarn')+' '+r.warn.join(', '):tr('planSaved');planDraw();if(PL.mode!=='admin')loadState(true);
    }).catch(function(){PL.busy=false;PL.ok=false;PL.msg='No connection.';planDraw();});
  }
}
