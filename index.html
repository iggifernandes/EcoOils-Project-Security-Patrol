<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patroli">
<meta name="theme-color" content="#122238">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>EcoOils Patroli</title>
<style>
:root{--bg:#0b1626;--panel:#122238;--panel2:#18304d;--line:#27425f;--text:#eaf0f7;--mute:#93a6bd;--amber:#f5a623;--amber2:#ffc861;--ok:#3ecf8e;--bad:#ff6b6b;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:2px solid var(--amber);background:var(--panel)}
.brand{font-size:14px;font-weight:700;color:var(--amber2)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#ver{font-size:11px;color:var(--mute);line-height:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.lang button.on{background:var(--amber);color:#1a1200;font-weight:700}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:4px 0 8px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:16px}
.btn{display:block;width:100%;background:var(--amber);color:#1a1200;border:0;border-radius:var(--r);padding:15px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:12px}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);font-size:14px;padding:10px;font-weight:600}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:4px 6px 0 0}
.btn:disabled{opacity:.5}
.note{color:var(--mute);font-size:13px;margin:6px 0}
.err{color:var(--bad);font-size:14px;margin:6px 0}
.banner{border-radius:var(--r);padding:10px 12px;margin:8px 0;font-size:14px;background:#3b2f10;border:1px solid var(--amber)}
.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.round{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.round b{font-size:15px}.round span{color:var(--mute);font-size:13px}
#left{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}
#left.warn{color:var(--amber2)}#left.late{color:var(--bad)}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cnt{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.cnt b{display:block;font-size:46px;line-height:1.05;font-variant-numeric:tabular-nums}
.cnt span{font-size:13px;color:var(--mute)}
.cnt.d b{color:var(--ok)}.cnt.r b{color:var(--amber2)}
.bar{height:14px;border-radius:7px;background:var(--panel2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.tabs{display:flex;gap:6px;margin:14px 0 6px}
.tabs button{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.zh{font-weight:700;font-size:13px;color:var(--amber2);margin:10px 0 3px}
.pt{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:4px 0;font-size:15px}
.pt small{color:var(--mute);white-space:nowrap}
.pt.hi b::after{content:" \2605";color:var(--amber2)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}th{background:var(--panel2)}
.scroll{overflow-x:auto}
.fl{color:var(--bad);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:400px;max-height:92vh;overflow:auto}
#scanModal{padding:0;background:#000;flex-direction:column}
#cam{width:100%;max-height:75vh;object-fit:cover;background:#000}
.frame{position:absolute;left:50%;top:38%;width:62vmin;height:62vmin;max-width:300px;max-height:300px;transform:translate(-50%,-50%);border:3px solid var(--amber);border-radius:18px;pointer-events:none}
.big{font-size:56px;text-align:center;line-height:1}
.okc{color:var(--ok)}.wrn{color:var(--amber2)}
.sp{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.links{margin-top:22px;text-align:center}
.links button{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:4px 0}.mem.off{opacity:.55}.mem small{color:var(--mute)}.mem .acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}.mem .btn.sm{margin:0;padding:6px 10px;font-size:13px}.pinbig{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--amber2);margin:8px 0;font-variant-numeric:tabular-nums}
.remember{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px}.remember input{width:20px;height:20px;margin:0}
</style></head><body>
<header><div class="brand" id="brand">EcoOils Patrol</div>
<div class="right"><span id="ver">v1.3.3</span><div class="lang" role="group" aria-label="Language"><button id="lEN" class="on" type="button">EN</button><button id="lID" type="button">BI</button></div></div></header>
<main>
<div id="banner"></div>

<section id="vSetup">
  <h1 id="tSetup"></h1>
  <form id="pinBox" autocomplete="off">
    <label for="gpin" id="lGpin"></label><input id="gpin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
    <div class="note" id="hGpin"></div>
    <button class="btn" id="bGpin" type="submit"></button>
  </form>
  <div class="err" id="setErr"></div>
  <div class="links"><button id="bAdmin" type="button"></button></div>
</section>

<section id="vPatrol" class="hidden">
  <div class="card">
    <div class="round"><div><b id="rLabel"></b><br><span id="who"></span></div><div style="text-align:right"><span id="lTime"></span><div id="left">--:--</div></div></div>
    <div class="counts"><div class="cnt d"><b id="nDone">0</b><span id="lDone"></span></div><div class="cnt r"><b id="nRem">0</b><span id="lRem"></span></div></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="note" id="ofTotal"></div>
  </div>
  <div id="holdBox"></div>
  <div id="clockBox"></div>
  <button class="btn" id="bScan" type="button"></button>
  <div class="note" id="pend"></div>
  <button class="btn ghost hidden" id="bTeamOpen" type="button"></button>
  <button class="btn ghost hidden" id="bPlanOpen" type="button"></button>
  <button class="btn ghost hidden" id="bHold" type="button"></button>
  <button class="btn ghost" id="bVid" type="button"></button>
  <div id="planCard"></div>
  <div id="awardCard"></div>
  <div class="tabs"><button id="tRem" class="on" type="button"></button><button id="tDone" type="button"></button></div>
  <div id="list"></div>
  <div class="links"><button id="bChange" type="button"></button></div>
</section>

<section id="vVid" class="hidden">
  <button class="btn ghost" id="vBack" type="button"></button>
  <div class="card"><video id="vPrev" playsinline muted autoplay style="width:100%;border-radius:10px;background:#000"></video><div class="note" id="vNote"></div><div id="vTime" style="font-size:22px;font-weight:700;text-align:center"></div></div>
  <button class="btn" id="vRec" type="button"></button>
  <button class="btn hidden" id="vSend" type="button"></button>
  <button class="btn ghost hidden" id="vRetake" type="button"></button>
  <div class="note" id="vMsg"></div>
</section>

<section id="vTeam" class="hidden">
  <button class="btn ghost" id="tBack" type="button"></button>
  <div id="teamBody"></div>
</section>

<section id="vPlan" class="hidden">
  <button class="btn ghost" id="pBack" type="button"></button>
  <div id="planBody"></div>
</section>

<section id="vAdmin" class="hidden">
  <div class="tabs" style="flex-wrap:wrap"><button id="aStats" class="on" type="button">Stats</button><button id="aLive" type="button">Live</button><button id="aHist" type="button">History</button><button id="aCal" type="button">Calibrate</button><button id="aSet" type="button">Settings</button><button id="aPlan" type="button">Plan</button><button id="aAward" type="button">Award</button><button id="aTeam" type="button">Team</button></div>
  <div id="aBody"></div>
  <button class="btn ghost" id="aOut" type="button">Log out of admin</button>
</section>
</main>

<div class="modal hidden" id="scanModal">
  <video id="cam" playsinline muted></video><div class="frame"></div><canvas id="cv" class="hidden"></canvas>
  <div style="padding:14px;text-align:center;width:100%"><div id="scanMsg" class="note" style="font-size:15px;color:#fff"></div><button class="btn ghost" id="scanX" type="button"></button></div>
</div>
<div class="modal hidden" id="resModal"><div class="box" id="resBody"></div></div>
<div class="modal hidden" id="pinModal"><form class="box" id="pinForm" autocomplete="off">
  <h1 style="margin-top:0">Admin</h1>
  <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <label class="remember"><input id="pinKeep" type="checkbox"><span id="lKeep"></span></label>
  <div class="err" id="pinErr"></div>
  <button class="btn" type="submit" id="pinGo"></button><button class="btn ghost" type="button" id="pinX"></button>
</form></div>

function api(body,ms){
  var ctl=window.AbortController?new AbortController():null,t=ctl?setTimeout(function(){ctl.abort();},ms||25000):null;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();}).then(function(j){if(t)clearTimeout(t);return j;},function(e){if(t)clearTimeout(t);throw e;});
}

function loadState(quiet){
  if(!API_URL||!S.pin)return Promise.resolve(false);

    S.loading=false;
    if(!r||!r.ok){if(r&&r.err==='pin'){dropLogin(tr('badGuardPin'));}else if(r&&r.err==='locked'){S.online=false;render();}return false;}
    S.state=r;S.guard=r.me.name;ls('sp_gname',S.guard);S.off=r.now-Date.now();S.online=true;ls('sp_state',JSON.stringify(r));render();return true;
  }).catch(function(){

function flush(){
  if(!S.queue.length||!API_URL||S.flushing)return Promise.resolve();
  S.flushing=true;
  var lim=Date.now()-36*3600000;S.queue=S.queue.filter(function(x){return x.ts>lim;});saveQ();
  var q=S.queue.slice(),p=Promise.resolve(),stop=false;
  q.forEach(function(it){p=p.then(function(){
    if(stop)return;
    var b={action:'scan',gp:it.pin||S.pin,pid:it.pid,lat:it.lat,lng:it.lng,acc:it.acc,clientTs:it.ts,photo:it.photo,queued:true};
    return api(b).then(function(r){
      if(r&&(r.ok||r.err==='unknown_point')){S.queue=S.queue.filter(function(x){return x!==it&&x.ts!==it.ts;});saveQ();}
      else if(r&&r.err==='pin'){if(S.pin&&it.guard===S.guard&&it.pin!==S.pin){it.pin=S.pin;saveQ();}stop=true;}
      else if(r&&r.err==='locked'){stop=true;}
    },function(){stop=true;});
  });});
  return p.then(function(){S.flushing=false;render();return loadState(true);},function(){S.flushing=false;});
}

/* ===== scanning ===== */
var stream=null,scanning=false,onCode=null,detector=null,qrLoad=null;
function loadJsQR(){
  if(window.jsQR)return Promise.resolve();
  if(!qrLoad)qrLoad=new Promise(function(ok,no){var e=document.createElement('script');e.src='jsQR.js';e.onload=ok;e.onerror=function(){qrLoad=null;no();};document.head.appendChild(e);});
  return qrLoad;
}
function openScan(cb){
  CK.paused=true;ckStop();onCode=cb;$('scanModal').classList.remove('hidden');$('scanMsg').textContent=tr('scanHelp');
  try{if(!detector&&window.BarcodeDetector)detector=new BarcodeDetector({formats:['qr_code']});}catch(e){detector=null;}
  (detector?Promise.resolve():loadJsQR()).then(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});}).then(function(s){
    stream=s;var v=$('cam');v.srcObject=s;v.setAttribute('playsinline','');return v.play();
  }).then(function(){scanning=true;scanLoop();}).catch(function(){$('scanMsg').textContent=tr('camErr');});
}
function gotCode(d){var f=onCode;closeScan();if(f)f(d);}
function scanLoop(){
  if(!scanning)return;
  var v=$('cam'),c=$('cv');
  if(v.readyState>=2&&v.videoWidth){
    if(detector){
      detector.detect(v).then(function(r){if(!scanning)return;if(r&&r.length&&r[0].rawValue){gotCode(r[0].rawValue);}else setTimeout(scanLoop,150);},function(){detector=null;setTimeout(scanLoop,150);});
      return;
    }
    if(window.jsQR){
      var w=Math.min(480,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;
      var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
      var im=x.getImageData(0,0,w,h),r=jsQR(im.data,w,h,{inversionAttempts:'dontInvert'});
      if(r&&r.data){gotCode(r.data);return;}
    }
  }
  setTimeout(scanLoop,180);
}
function closeScan(){setTimeout(function(){CK.paused=false;},25000);scanning=false;if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}$('scanModal').classList.add('hidden');}
function parseCode(raw){
  var s=String(raw||'').trim(),n=null;
  try{var u=new URL(s);var v=u.searchParams.get('loc');if(v!==null)n=parseInt(v,10);}catch(e){if(/^\d{1,3}$/.test(s))n=parseInt(s,10);}
  return n;
}
function getFix(){
  return new Promise(function(res){
    if(!navigator.geolocation)return res(null);
    var best=null,fin=false,id=null,t1=null,t2=null;
    function end(){if(fin)return;fin=true;try{navigator.geolocation.clearWatch(id);}catch(e){}clearTimeout(t1);clearTimeout(t2);res(best);}
    id=navigator.geolocation.watchPosition(function(p){var f={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};if(!best||f.acc<best.acc)best=f;if(f.acc<=8)end();},function(){},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
    t1=setTimeout(function(){if(best)end();},7000);t2=setTimeout(end,20000);
  });
}
function stampTime(){
  var d=new Date(nowMs()+7*3600000),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p=function(n){return (n<10?'0':'')+n;};
  return p(d.getUTCDate())+' '+M[d.getUTCMonth()]+' '+d.getUTCFullYear()+'  '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' WIB';
}
function shrink(file,lines){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var k=Math.min(1,640/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      if(lines&&lines.length){
        var fs=Math.max(15,Math.round(c.width/22)),pad=Math.round(fs*0.45),bh=lines.length*Math.round(fs*1.25)+pad*2;
        x.fillStyle='rgba(0,0,0,0.62)';x.fillRect(0,c.height-bh,c.width,bh);
        x.fillStyle='#fff';x.textBaseline='top';
        lines.forEach(function(t,i){x.font=(i===0?'bold ':'')+fs+'px Arial,Helvetica,sans-serif';
          var s=t;while(s.length>4&&x.measureText(s).width>c.width-pad*2)s=s.slice(0,-2);if(s!==t)s=s.replace(/\s+$/,'')+'...';
          x.fillText(s,pad,c.height-bh+pad+i*Math.round(fs*1.25));});
      }
      res(c.toDataURL('image/jpeg',0.62).split(',')[1]);};
    im.onerror=function(){URL.revokeObjectURL(u);rej();};im.src=u;
  });
}

  showRes('<p><span class="sp"></span>'+esc(tr('gps'))+'</p>');

function submit(pt,fix,photo){
  showRes('<p><span class="sp"></span>'+esc(tr('sending'))+'</p>');
  var it={pid:pt.id,guard:S.guard,pin:S.pin,lat:fix?fix.lat:null,lng:fix?fix.lng:null,acc:fix?fix.acc:null,ts:nowMs(),photo:photo||''};
  return api({action:'scan',gp:S.pin,pid:it.pid,lat:it.lat,lng:it.lng,acc:it.acc,clientTs:it.ts,photo:it.photo},40000).then(function(r){return r;},function(){return null;}).then(function(r){
    if(!r){S.queue.push(it);saveQ();S.online=false;render();return result(pt,null);}
    if(!r.ok){
      if(r.err==='locked'){S.queue.push(it);saveQ();S.online=false;render();return result(pt,null);}
      if(r.err==='pin'){hideRes();dropLogin(tr('badGuardPin'));return;}
      showRes('<div class="big wrn">!</div><p style="text-align:center">'+esc(errText(r.err))+'</p><button class="btn" data-act="close">'+esc(tr('close'))+'</button>');return;
    }
    return loadState(true).then(function(){if(r.needPhoto&&r.scanId)return photoStep(pt,r);result(pt,r);});
  });
}

    $('cRo').addEventListener('click',function(){var pid=$('cP').value;if(!pid)return;var out=$('cOut');out.classList.remove('hidden');aApi({action:'a_radius',pid:pid,radius:$('cR').value}).then(function(x){out.innerHTML=x.ok?'<p class="okc">Radius saved.</p>':'<p class="err">'+esc(x.err)+'</p>';if(x.ok)aCal();});});
    $('cRoute').addEventListener('click',function(){var out=$('cOut');out.classList.remove('hidden');out.innerHTML='<span class="sp"></span>';aApi({action:'a_route'}).then(function(x){out.innerHTML=x.ok?'<p class="okc">Route set for '+x.n+' points ('+x.uncal+' not calibrated, placed last).</p>':'<p class="err">'+esc(x.err==='calibrate_first'?'Calibrate at least 2 points first.':x.err)+'</p>';});});
    $('cGo').addEventListener('click',function(){
      var pid=$('cP').value;if(!pid)return;
      var out=$('cOut');out.classList.remove('hidden');out.innerHTML='<span class="sp"></span>Reading...';
      var fixes=[],wid=null,t0=Date.now(),done=false;
      function finish(){
        if(done)return;done=true;try{navigator.geolocation.clearWatch(wid);}catch(e){}
        if(!fixes.length){out.innerHTML='<p class="err">No location. Allow location access and try outdoors.</p>';return;}
        var sw=0,la=0,ln=0,best=1e9;fixes.forEach(function(f){var w=1/(Math.max(f.acc,3)*Math.max(f.acc,3));sw+=w;la+=f.lat*w;ln+=f.lng*w;best=Math.min(best,f.acc);});
        var res={lat:la/sw,lng:ln/sw,acc:best,n:fixes.length};A.cal=res;
        out.innerHTML='<p>'+res.n+' readings. Best accuracy '+Math.round(res.acc)+' m.</p><p class="note">'+res.lat.toFixed(6)+', '+res.lng.toFixed(6)+'</p>'+(res.acc>20?'<p class="err">Accuracy is poor. Move to open sky and read again, or save anyway.</p>':'')+'<button class="btn" id="cSave" type="button">Save as official location</button>';
        $('cSave').addEventListener('click',function(){
          aApi({action:'a_calibrate',pid:pid,radius:$('cR').value,lat:res.lat,lng:res.lng,acc:res.acc,n:res.n}).then(function(x){out.innerHTML=x.ok?'<p class="okc">Saved.</p>':'<p class="err">'+esc(x.err)+'</p>';if(x.ok)aCal();});
        });
      }
      wid=navigator.geolocation.watchPosition(function(p){fixes.push({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});out.innerHTML='<span class="sp"></span>Reading '+fixes.length+'/10, accuracy '+Math.round(p.coords.accuracy)+' m';if(fixes.length>=10||(fixes.length>=3&&p.coords.accuracy<=5))finish();},function(){finish();},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
      setTimeout(finish,60000);
    });
  }).catch(function(){$('aBody').innerHTML='<p class="err">No connection.</p>';});
}

/* ===== Clock in (shift start). Button only inside the circle around the guard house; the server checks again. ===== */
var CK={wid:null,pos:null,html:'',busy:false,msg:'',paused:false};
function ckDist(a,b,c,d){var R=6371000,t=Math.PI/180,dl=(c-a)*t,dn=(d-b)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}
function ckStop(){if(CK.wid!==null){try{navigator.geolocation.clearWatch(CK.wid);}catch(e){}CK.wid=null;}}
function ckStart(){
  if(CK.paused||CK.wid!==null||!navigator.geolocation)return;
  try{CK.wid=navigator.geolocation.watchPosition(function(p){CK.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};clockRender();},function(){},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});}catch(e){CK.wid=null;}
}
function clockInside(c){
  var p=CK.pos;if(!p||Date.now()-p.t>90000)return false;
  return ckDist(p.lat,p.lng,c.gate.lat,c.gate.lng)<=c.gate.r+Math.min(p.acc||0,30);
}
function clockRender(){
  var box=$('clockBox'),st=S.state;if(!box||!st||$('vPatrol').classList.contains('hidden')){ckStop();return;}
  var c=st.clock,h='',now=nowMs();
  if(!c){box.innerHTML='';return;}
  if(c.mine){
    ckStop();
    h='<div class="card"><b>&#10003; '+esc(tr('clkDone'))+' '+esc(c.mine.at)+'</b> <span class="note">'+(c.mine.status==='LATE'?esc(tr('clkLate'))+' '+c.mine.late+' '+esc(tr('clkMin')):(c.mine.status==='MANUAL'?esc(tr('clkManual')):esc(tr('clkOn'))))+'</span><br><small class="note">'+esc(tr('sh'+c.shift))+'</small></div>';
  }else if(c.win&&now>=c.win.opens&&now<=c.win.closes){
    ckStart();
    if(CK.busy)h='<div class="card"><span class="sp"></span>'+esc(tr('clkBusy'))+'</div>';
    else if(clockInside(c))h='<button class="btn" id="bClock" type="button">'+esc(tr('clkIn'))+' &middot; '+esc(tr('sh'+c.win.shift))+'</button>'+(CK.msg?'<div class="note">'+esc(CK.msg)+'</div>':'');
    else h='<div class="note">'+esc(tr(CK.pos?'clkGate':'clkWait'))+'</div>';
  }else{ckStop();}
  if(h!==CK.html){CK.html=h;box.innerHTML=h;var b=$('bClock');if(b)b.addEventListener('click',clockTap);}
}
function clockTap(){
  var c=S.state&&S.state.clock;if(!c||CK.busy)return;
  CK.busy=true;CK.msg='';clockRender();
  (CK.pos&&Date.now()-CK.pos.t<30000?Promise.resolve(CK.pos):getFix()).then(function(f){
    return api({action:'clockin',gp:S.pin,lat:f?f.lat:null,lng:f?f.lng:null,acc:f?f.acc:null});
  }).then(function(r){
    CK.busy=false;
    if(r&&r.ok){CK.msg='';return loadState(true);}
    if(r&&r.err==='no_window'){return loadState(true);}
    CK.msg=tr('clkRetry');CK.html='';clockRender();
  }).catch(function(){CK.busy=false;CK.msg=tr('clkNet');CK.html='';clockRender();});
}

/* ===== Short low-resolution video, stored in Google Drive ===== */
var VD={stream:null,rec:null,chunks:[],blob:null,mime:'',t0:0,timer:null,sec:0};
var VMAX=30;
function vStop(){if(VD.timer){clearInterval(VD.timer);VD.timer=null;}try{if(VD.rec&&VD.rec.state!=='inactive')VD.rec.stop();}catch(e){}}
function vClose(){vStop();if(VD.stream){VD.stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});VD.stream=null;}var v=$('vPrev');v.srcObject=null;v.removeAttribute('src');}
function vReset(){VD.chunks=[];VD.blob=null;VD.sec=0;$('vTime').textContent='';$('vMsg').textContent='';$('vRec').classList.remove('hidden');$('vRec').textContent=tr('vidRec');$('vSend').classList.add('hidden');$('vRetake').classList.add('hidden');}
function vOpen(){
  show('vVid');vReset();
  var md=navigator.mediaDevices;
  if(!md||!md.getUserMedia||!window.MediaRecorder){$('vMsg').textContent=tr('vidNoCam');$('vRec').classList.add('hidden');return;}
  var c={video:{facingMode:{ideal:'environment'},width:{ideal:480},height:{ideal:270},frameRate:{ideal:15,max:20}},audio:true};
  md.getUserMedia(c).catch(function(){return md.getUserMedia({video:c.video,audio:false});}).then(function(st){
    VD.stream=st;var v=$('vPrev');v.srcObject=st;v.muted=true;try{v.play();}catch(e){}
  }).catch(function(){$('vMsg').textContent=tr('vidNoCam');$('vRec').classList.add('hidden');});
}
function vPickMime(){var L=['video/webm;codecs=vp8,opus','video/webm','video/mp4'];for(var i=0;i<L.length;i++){try{if(MediaRecorder.isTypeSupported(L[i]))return L[i];}catch(e){}}return '';}
$('vRec').addEventListener('click',function(){
  if(VD.rec&&VD.rec.state==='recording'){vStop();return;}
  if(!VD.stream)return;
  VD.chunks=[];VD.mime=vPickMime();
  try{VD.rec=new MediaRecorder(VD.stream,VD.mime?{mimeType:VD.mime,videoBitsPerSecond:250000,audioBitsPerSecond:32000}:{videoBitsPerSecond:250000});}catch(e){$('vMsg').textContent=tr('vidNoCam');return;}
  VD.rec.ondataavailable=function(e){if(e.data&&e.data.size)VD.chunks.push(e.data);};
  VD.rec.onstop=function(){
    if(VD.timer){clearInterval(VD.timer);VD.timer=null;}
    VD.blob=new Blob(VD.chunks,{type:(VD.rec&&VD.rec.mimeType)||VD.mime||'video/webm'});VD.sec=Math.max(1,Math.round((Date.now()-VD.t0)/1000));
    var v=$('vPrev');v.srcObject=null;v.src=URL.createObjectURL(VD.blob);v.muted=false;v.controls=true;
    $('vRec').classList.add('hidden');$('vSend').classList.remove('hidden');$('vRetake').classList.remove('hidden');$('vTime').textContent=VD.sec+' s';
  };
  VD.t0=Date.now();VD.rec.start(1000);$('vRec').textContent=tr('vidStop');
  VD.timer=setInterval(function(){var el=Math.round((Date.now()-VD.t0)/1000);$('vTime').textContent=el+' / '+VMAX+' s';if(el>=VMAX)vStop();},250);
});
$('vRetake').addEventListener('click',function(){var v=$('vPrev');v.controls=false;v.removeAttribute('src');v.srcObject=VD.stream;v.muted=true;try{v.play();}catch(e){}vReset();});
$('vSend').addEventListener('click',function(){
  if(!VD.blob)return;
  $('vMsg').textContent=tr('vidSending');$('vSend').disabled=true;
  var fr=new FileReader();
  fr.onload=function(){
    var b64=String(fr.result).split(',')[1]||'';
    api({action:'video',gp:S.pin,video:b64,mime:VD.blob.type,sec:VD.sec,note:(S.state&&S.state.hold&&S.state.hold.on)?'Weather hold':'Conditions'},90000).then(function(r){
      $('vSend').disabled=false;
      if(r&&r.ok){$('vMsg').textContent=tr('vidSent');vClose();setTimeout(function(){showPatrol();},1200);}
      else $('vMsg').textContent=tr('vidFail');
    }).catch(function(){$('vSend').disabled=false;$('vMsg').textContent=tr('vidFail');});
  };
  fr.readAsDataURL(VD.blob);
});
$('vBack').addEventListener('click',function(){vClose();showPatrol();});
$('bVid').addEventListener('click',vOpen);

var TM={mode:'danru',box:null,q:'',data:null,pending:null};
function tApi(b){if(TM.mode==='admin')b.pin=A.pin;else b.gp=S.pin;return api(b);}
function teamOpen(){TM.q='';TM.mode='danru';TM.box=$('teamBody');show('vTeam');teamLoad();}
function aTeam(){TM.q='';TM.mode='admin';TM.box=$('aBody');teamLoad();}
function teamLoad(){
  (TM.mode==='admin'?$('teamBody'):$('aBody')).innerHTML='';
  TM.box.innerHTML='<p><span class="sp"></span></p>';
  tApi({action:'d_list'}).then(function(r){
    if(!r.ok){if(r.err==='pin'||r.err==='auth'&&TM.mode==='admin'){TM.mode==='admin'?aErr({err:'pin'}):dropLogin(tr('badGuardPin'));return;}TM.box.innerHTML='<p class="err">'+esc(errText(r.err))+'</p>';return;}
    TM.data=r;teamDraw();
  }).catch(function(){TM.box.innerHTML='<p class="err">No connection.</p>';});
}
function teamDraw(){
  var r=TM.data,adm=TM.mode==='admin',q=TM.q.toLowerCase(),h='';
  h+='<div class="card"><b>'+esc(tr('addTitle'))+'</b><input id="tmName" placeholder="'+esc(tr('namePh'))+'" maxlength="40" autocomplete="off" style="margin-top:8px"><button class="btn" id="tmAdd" type="button">'+esc(tr('addGo'))+'</button><div class="err" id="tmErr"></div></div>';
  h+='<input id="tmQ" placeholder="'+esc(tr('search'))+'" value="'+esc(TM.q)+'" style="margin-top:12px"><p class="note">'+r.members.filter(function(m){return m.active;}).length+' '+esc(tr('members'))+'</p>';
  r.members.slice().sort(function(a,b){return (b.active-a.active)||a.name.localeCompare(b.name);}).forEach(function(m){
    if(q&&m.name.toLowerCase().indexOf(q)<0)return;
    var lock=m.danru&&!adm,n=esc(m.name);
    h+='<div class="mem'+(m.active?'':' off')+'"><div><b>'+n+'</b>'+(m.danru?' <span class="wrn">&#9733; '+esc(m.role==='Danru'?tr('danru'):tr('supv'))+'</span>':'')+'<br><small>'+esc(m.role)+' &middot; '+esc(m.hasPin?tr('pinSet'):tr('noPin'))+(m.active?'':' &middot; '+esc(tr('inactive')))+'</small></div><div class="acts">';
    if(!lock){
      if(m.active)h+='<button class="btn sm ghost" data-a="clock" data-n="'+n+'" type="button">'+esc(tr('clkIn'))+'</button>';
      if(m.active)h+='<button class="btn sm" data-a="reset" data-n="'+n+'" type="button">'+esc(tr('newPin'))+'</button>';
      h+='<button class="btn sm ghost" data-a="'+(m.active?'off':'on')+'" data-n="'+n+'" type="button">'+esc(m.active?tr('deact'):tr('act'))+'</button>';
      if(adm)h+='<button class="btn sm ghost" data-a="'+(m.danru?'undanru':'danru')+'" data-n="'+n+'" type="button">'+esc(m.danru?tr('rmDanru'):tr('mkDanru'))+'</button>';
    }
    h+='</div></div>';
  });
  TM.box.innerHTML=h;
  var keep=$('tmQ');keep.addEventListener('input',function(){TM.q=this.value;var pos=this.selectionStart;teamDraw();var k=$('tmQ');k.focus();try{k.setSelectionRange(pos,pos);}catch(e){}});
  $('tmAdd').addEventListener('click',teamAdd);
  $('tmName').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();teamAdd();}});
  TM.box.onclick=function(e){
    var a=e.target&&e.target.getAttribute&&e.target.getAttribute('data-a'),n=e.target&&e.target.getAttribute&&e.target.getAttribute('data-n');
    if(!a||!n)return;
    var nm=n;
    if(a==='clock')ask(tr('clkManAsk')+' '+nm+'?',function(){teamAct({action:'d_clock',name:nm});});
    if(a==='reset')ask(tr('confirmReset')+' '+nm+'?',function(){teamAct({action:'d_reset',name:nm},true);});
    if(a==='off')ask(tr('confirmOff')+' '+nm+'?',function(){teamAct({action:'d_active',name:nm,active:false});});
    if(a==='on')ask(tr('confirmOn')+' '+nm+'?',function(){teamAct({action:'d_active',name:nm,active:true});});
    if(a==='danru'||a==='undanru')ask((a==='danru'?tr('mkDanru'):tr('rmDanru'))+': '+nm+'?',function(){teamAct({action:'d_danru',name:nm,danru:a==='danru'});});
  };
}
function ask(text,yes){TM.pending=yes;showRes('<p style="font-size:17px;text-align:center"><b>'+esc(text)+'</b></p><button class="btn" data-act="yes">'+esc(tr('yes'))+'</button><button class="btn ghost" data-act="close">'+esc(tr('no'))+'</button>');}
function pinCard(name,pin){showRes('<p style="text-align:center;margin:0"><b>'+esc(tr('pinShowTitle'))+' '+esc(name)+'</b></p><div class="pinbig">'+esc(pin)+'</div><p class="note" style="text-align:center">'+esc(tr('pinShowHelp'))+'</p><button class="btn" data-act="close">'+esc(tr('done2'))+'</button>');}
function teamAct(b,wantPin){
  showRes('<p><span class="sp"></span>'+esc(tr('sending'))+'</p>');
  tApi(b).then(function(r){
    if(!r.ok){showRes('<div class="big wrn">!</div><p style="text-align:center">'+esc(errText(r.err))+'</p><button class="btn" data-act="close">'+esc(tr('close'))+'</button>');return;}
    if(wantPin&&r.pin)pinCard(r.name,r.pin);else hideRes();
    teamLoad();
  }).catch(function(){showRes('<p class="err">No connection.</p><button class="btn" data-act="close">'+esc(tr('close'))+'</button>');});
}
function teamAdd(){
  var v=$('tmName').value.replace(/\s+/g,' ').trim();$('tmErr').textContent='';
  if(v.length<2){$('tmErr').textContent=errText('bad_name');return;}
  showRes('<p><span class="sp"></span>'+esc(tr('sending'))+'</p>');
  tApi({action:'d_add',name:v}).then(function(r){
    if(!r.ok){hideRes();$('tmErr').textContent=errText(r.err);return;}
    pinCard(r.name,r.pin);TM.q='';teamLoad();
  }).catch(function(){hideRes();$('tmErr').textContent='No connection.';});
}

/* ===== Shift plan (Danru, Shift Supervisor, admin) ===== */
var PL={mode:'danru',box:null,on:false,date:'',shift:'',rows:[],day:{P:[],S:[],M:[]},guards:[],duties:[],msg:'',ok:true,busy:false,loaded:false};
function jktToday(){return new Date(nowMs()+7*3600000).toISOString().slice(0,10);}
function addDays(d,n){return new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);}
function shiftNow(){var h=new Date(nowMs()+7*3600000).getUTCHours();return h>=7&&h<15?'P':(h>=15&&h<23?'S':'M');}
function dayHtml(day,date,me){
  var st=S.state&&S.state.plan,cur=st?st.date+st.shift:'',h='';
  ['P','S','M'].forEach(function(c){
    var rows=(day&&day[c])||[],isNow=cur&&cur===date+c;
    h+='<div style="margin-top:10px"><b>'+esc(tr('sh'+c))+'</b>'+(isNow?' <span class="okc">&#9679; '+esc(tr('nowTag'))+'</span>':'')+'</div>';
    if(!rows.length)h+='<div class="note">'+esc(tr('noneYet'))+'</div>';
    rows.forEach(function(r){
      var mine=me&&(r.guard.toLowerCase()===me||(r.buddy&&r.buddy.toLowerCase()===me));
      h+='<div style="margin-top:4px'+(mine?';font-weight:700':'')+'">'+esc(r.duty)+': '+esc(r.guard)+(r.buddy?' + '+esc(r.buddy):'')+(mine?' &#9733; '+esc(tr('planYou')):'')+'</div>';
    });
  });
  return h;
}
function planCard(){
  var st=S.state,box=$('planCard');if(!box)return;
  var p=st&&st.plan,any=false;
  if(p&&p.day)['P','S','M'].forEach(function(c){if((p.day[c]||[]).length)any=true;});
  if(!any){setHtml(box,'');return;}
  setHtml(box,'<div class="card"><b>'+esc(tr('planYour'))+' &middot; '+esc(p.date)+'</b>'+dayHtml(p.day,p.date,(S.guard||'').toLowerCase())+'</div>');
}
function pApi(b){if(PL.mode==='admin')b.pin=A.pin;else b.gp=S.pin;return api(b);}
function planOpen(mode){
  PL.mode=mode||'danru';PL.box=PL.mode==='admin'?$('aBody'):$('planBody');PL.on=true;$('planBody').innerHTML='';if(PL.mode!=='admin')$('aBody').innerHTML='';
  PL.date=jktToday();PL.shift=shiftNow();PL.msg='';PL.ok=true;PL.loaded=false;
  if(PL.mode!=='admin')show('vPlan');
  planLoad();
}
function planLoad(){
  PL.box.innerHTML='<p><span class="sp"></span> '+esc(tr('planLoad'))+'</p>';
  pApi({action:'d_plan_get',date:PL.date,shift:PL.shift}).then(function(r){
    if(!r.ok){if(r.err==='auth'||r.err==='pin'){if(PL.mode==='admin')aErr({err:'pin'});else dropLogin(tr('badGuardPin'));return;}PL.box.innerHTML='<p class="err">'+esc(errText(r.err))+'</p>';return;}
    PL.guards=r.guards;PL.duties=r.duties;PL.day=r.day||{P:[],S:[],M:[]};
    PL.rows=r.rows.map(function(x){return {duty:x.duty,guard:x.guard,buddy:x.buddy};});
    if(!PL.rows.length)PL.rows=r.duties.map(function(d){return {duty:d,guard:'',buddy:''};});
    PL.loaded=true;planDraw();
  }).catch(function(){PL.box.innerHTML='<p class="err">No connection.</p>';});
}
function planDraw(){
  if(!PL.loaded||!PL.box){return;}
  var used={};PL.rows.forEach(function(r){if(r.guard)used[r.guard]=1;if(r.buddy)used[r.buddy]=1;});
  function opts(sel,blank){
    var o='<option value="">'+esc(blank)+'</option>';
    PL.guards.forEach(function(g){var dis=used[g]&&g!==sel;o+='<option value="'+esc(g)+'"'+(g===sel?' selected':'')+(dis?' disabled':'')+'>'+esc(g)+'</option>';});
    return o;
  }
  var min=addDays(jktToday(),-1),max=addDays(jktToday(),14);
  var h='<div class="card"><b>'+esc(tr('plan'))+'</b><label class="note" for="plDate" style="display:block;margin-top:8px">'+esc(tr('planDate'))+'</label><input type="date" id="plDate" value="'+esc(PL.date)+'" min="'+min+'" max="'+max+'"><div class="tabs" style="margin-top:10px">';
  ['P','S','M'].forEach(function(c){h+='<button type="button" data-a="sh" data-v="'+c+'" class="'+(PL.shift===c?'on':'')+'">'+esc(tr('sh'+c))+'</button>';});
  h+='</div><p class="note">'+esc(tr('planNote'))+'</p></div>';
  h+='<div class="card"><b>'+esc(tr('dayAll'))+' &middot; '+esc(PL.date)+'</b>'+dayHtml(PL.day,PL.date,'')+'</div>';
  PL.rows.forEach(function(r,i){
    var need=PL.shift==='M'&&r.guard&&!r.buddy;
    h+='<div class="card"><label class="note">'+esc(tr('planDuty'))+'</label><select data-i="'+i+'" data-f="duty">';
    PL.duties.forEach(function(d){h+='<option value="'+esc(d)+'"'+(d===r.duty?' selected':'')+'>'+esc(d)+'</option>';});
    h+='</select><label class="note" style="margin-top:8px;display:block">'+esc(tr('planGuard'))+'</label><select data-i="'+i+'" data-f="guard">'+opts(r.guard,tr('chooseGuard'))+'</select>'
      +'<label class="note" style="margin-top:8px;display:block">'+esc(tr('planBuddy'))+'</label><select data-i="'+i+'" data-f="buddy">'+opts(r.buddy,tr('noBuddy'))+'</select>'
      +(need?'<div class="wrn" style="margin-top:6px">'+esc(tr('buddyNight'))+'</div>':'')
      +'<button class="btn sm ghost" type="button" data-a="del" data-v="'+i+'">'+esc(tr('delRow'))+' &times;</button></div>';
  });
  h+='<button class="btn ghost" type="button" data-a="add">+ '+esc(tr('addDuty'))+'</button><button class="btn" type="button" data-a="save"'+(PL.busy?' disabled':'')+'>'+esc(tr('planSave'))+'</button>';
  h+='<div class="'+(PL.ok?'okc':'err')+'" id="plMsg" style="margin-top:8px">'+esc(PL.msg)+'</div>';
  PL.box.innerHTML=h;
}
function planChange(e){
  if(!PL.on||PL.box!==e.currentTarget)return;
  var t=e.target,i=t.getAttribute&&t.getAttribute('data-i'),f=t.getAttribute&&t.getAttribute('data-f');
  if(t.id==='plDate'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){PL.date=t.value;PL.msg='';planLoad();}return;}
  if(i==null||!f)return;PL.rows[+i][f]=t.value;PL.msg='';planDraw();
}
function planClick(e){
  if(!PL.on||PL.box!==e.currentTarget)return;
  var a=e.target&&e.target.getAttribute&&e.target.getAttribute('data-a'),v=e.target&&e.target.getAttribute&&e.target.getAttribute('data-v');
  if(!a)return;
  if(a==='sh'){PL.shift=v;PL.msg='';planLoad();}
  if(a==='del'){PL.rows.splice(+v,1);planDraw();}
  if(a==='add'){PL.rows.push({duty:PL.duties[PL.duties.length-1]||'',guard:'',buddy:''});planDraw();}
  if(a==='save'){
    PL.busy=true;PL.msg='';planDraw();
    pApi({action:'d_plan_set',date:PL.date,shift:PL.shift,rows:PL.rows}).then(function(r){
      PL.busy=false;
      if(!r.ok){PL.ok=false;PL.msg=errText(r.err);planDraw();return;}
      PL.day[PL.shift]=PL.rows.filter(function(x){return x.guard;}).map(function(x){return {duty:x.duty,guard:x.guard,buddy:x.buddy};});
      PL.ok=true;PL.msg=r.warn&&r.warn.length?tr('buddyWarn')+' '+r.warn.join(', '):tr('planSaved');planDraw();if(PL.mode!=='admin')loadState(true);
    }).catch(function(){PL.busy=false;PL.ok=false;PL.msg='No connection.';planDraw();});
  }
}
$('planBody').addEventListener('change',planChange);$('planBody').addEventListener('click',planClick);
$('aBody').addEventListener('change',planChange);$('aBody').addEventListener('click',planClick);
$('bPlanOpen').addEventListener('click',function(){planOpen('danru');});
$('pBack').addEventListener('click',function(){PL.on=false;showPatrol();});

$('bTeamOpen').addEventListener('click',teamOpen);
$('tBack').addEventListener('click',function(){showPatrol();});
$('bScan').addEventListener('click',function(){openScan(handleCode);});

    else{$('pinErr').textContent=tr('badPin');}
  }).catch(function(){$('pinErr').textContent='No connection.';});

$('aStats').addEventListener('click',function(){aTab('stats');});$('aLive').addEventListener('click',function(){aTab('live');});$('aHist').addEventListener('click',function(){aTab('hist');});
$('aCal').addEventListener('click',function(){aTab('cal');});$('aSet').addEventListener('click',function(){aTab('set');});$('aPlan').addEventListener('click',function(){aTab('plan');});$('aAward').addEventListener('click',function(){aTab('award');});$('aTeam').addEventListener('click',function(){aTab('team');});
$('aOut').addEventListener('click',function(){aLogout();});
window.addEventListener('online',function(){S.online=true;flush();});
window.addEventListener('offline',function(){S.online=false;render();});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('vPatrol').classList.contains('hidden')){loadState(true);flush();}});

setInterval(function(){if(S.queue.length&&!document.hidden&&!S.flushing&&!$('vPatrol').classList.contains('hidden'))flush();},12000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
applyLang();startUp();
})();
